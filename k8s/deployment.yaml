apiVersion: apps/v1
kind: Deployment
metadata:
  name: agda-mcp-ingest
  namespace: llm-gateway
  labels:
    app: agda-mcp-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agda-mcp-ingest
  template:
    metadata:
      labels:
        app: agda-mcp-ingest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2231 # Must match Ceph directory owner for write access
        fsGroup: 2231
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        # Dedicated secret for THIS project's private GHCR package.
        # Do NOT point this back at litellm's shared `ghcr-credentials`:
        # that secret's PAT cannot read ghcr.io/cliu238/agda-mcp-server
        # (verified 403), and overwriting it with our PAT would break
        # litellm's own pulls (our PAT gets 403 on ghcr.io/jh-dsai/litellm).
        - name: agda-mcp-ghcr
      # PVC-ownership postmortem (2026-07-05, 08-05 Task 1 EACCES): when a
      # subPath directory does not exist, the KUBELET creates it as
      # root:root, and on this ACL-enabled CephFS mount the fsGroup
      # group-write bits are defeated by the ACL mask — uid-2231 processes
      # get EACCES (litellm lesson 16: the directory OWNER uid must match
      # runAsUser; group bits are not enough here). PodSecurity
      # "restricted" forbids any root pod/initContainer that could chown.
      # Fix: this initContainer runs as 2231 BEFORE the main container's
      # subPath mounts are resolved, mounts the PVC ROOT, and pre-creates
      # the data tree — dirs created by 2231 are OWNED by 2231. The
      # original kubelet-created root-owned `agda-mcp/` tree is orphaned
      # junk only an IDIES admin can remove; the live tree is
      # `agda-mcp-data/`.
      initContainers:
        - name: pvc-dirs
          image: ghcr.io/cliu238/agda-mcp-server:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - >-
              mkdir -p /pvc/agda-mcp-data/team-storage /pvc/agda-mcp-data/cluster-fix-queue &&
              ls -lan /pvc/agda-mcp-data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # llm-gateway-compute quota rejects any container (init
          # included) without explicit requests+limits. Effective pod
          # resources are max(init, sum(main)), so these numbers — all at
          # or below the main container's own — add zero quota footprint.
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: team-storage
              mountPath: /pvc
      containers:
        - name: agda-mcp-ingest
          image: ghcr.io/cliu238/agda-mcp-server:latest
          imagePullPolicy: Always
          # The image CMD is `node dist/index.js` — the MCP STDIO server,
          # which exits immediately in a pod (stdin is closed), producing
          # a log-less CrashLoopBackOff (first-deploy postmortem,
          # 2026-07-05). Every k8s workload on this image must therefore
          # override `command:` explicitly with the script it means to
          # run, exactly as k8s/cronjob.yaml already does. tsx (not plain
          # node) for the same .js->.ts specifier reason as the cronjob.
          command:
            - npx
            - tsx
            - scripts/team/ingest-server.mjs
          ports:
            - containerPort: 4000
          env:
            - name: AGDA_MCP_TEAM_STORAGE_DIR
              value: /data/team-uploads
            - name: AGDA_MCP_TEAM_INGEST_PORT
              value: "4000"
            - name: AGDA_MCP_TEAM_INGEST_HOST
              # Deliberate override of the script's loopback-only default:
              # inside a pod's own network namespace, binding all interfaces
              # is correct and expected — the pod is only reachable via the
              # Service/Ingress below, both namespace/cluster-scoped, so this
              # is not a public exposure.
              value: "0.0.0.0"
            - name: AGDA_MCP_TEAM_INGEST_MAX_BYTES
              value: "536870912"
            - name: AGDA_MCP_TEAM_KEYS_PATH
              value: /etc/agda-mcp-team/team-keys.json
          volumeMounts:
            - name: team-storage
              mountPath: /data/team-uploads
              # agda-mcp-data (NOT agda-mcp): see the initContainer note —
              # this tree is pre-created uid-2231 by pvc-dirs.
              subPath: agda-mcp-data/team-storage
            - name: team-keys
              mountPath: /etc/agda-mcp-team
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: team-storage
          persistentVolumeClaim:
            # Reuse the existing PVC (do NOT create a new PVC) — see
            # .claude/skills/agda-mcp-k8s-deploy/SKILL.md Verified Facts.
            claimName: sciserver-datavolumes-01-rw
        - name: team-keys
          secret:
            secretName: agda-mcp-team-keys
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: agda-mcp-ingest
  namespace: llm-gateway
  labels:
    app: agda-mcp-ingest
spec:
  type: ClusterIP
  selector:
    app: agda-mcp-ingest
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
