name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify package
        run: npm run verify

  integration:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Agda
        uses: wenkokke/setup-agda@13475d93b4fdb4a49c1c22f680be2f2e6b279daf # v2
        with:
          agda-version: "2.7.0.1"
          agda-stdlib-version: "2.1.1"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Agda is available
        run: agda --version

      - name: Run integration tests
        run: npm run test:all
        env:
          RUN_AGDA_INTEGRATION: "1"
          # Quarantined pre-existing Linux-lane failures — fix-queue
          # fb57abbe7df6dfe8 (DEFERRED v1.1, inherited from v1.0; same
          # files red on run 28638480726, pre-v1.1). Remove entries as
          # the next milestone's queue review fixes them. NEW failures
          # in any other file still fail this job.
          AGDA_MCP_CI_QUARANTINE: "test/integration/mcp/dogfood-flake-classify-live.test.ts,test/integration/mcp/capture-regression.test.ts,test/unit/agda/session-capture/manifest-builder.test.ts"

